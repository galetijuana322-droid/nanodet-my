class_names:
- polyp
data:
  train:
    ann_path: D:/NTUFYP/code/nanodet-main-im/dataset/kvasir-Dataset/kvasir-seg/Kvasir-SEG/train_coco.json
    img_path: D:/NTUFYP/code/nanodet-main-im/dataset/kvasir-Dataset/kvasir-seg/Kvasir-SEG/images
    input_size:
    - 320
    - 320
    keep_ratio: true
    name: CocoDataset
    pipeline:
      brightness: 0.2
      contrast:
      - 0.6
      - 1.4
      flip: 0.5
      normalize:
      - - 103.53
        - 116.28
        - 123.675
      - - 57.375
        - 57.12
        - 58.395
      perspective: 0.0
      rotation: 0
      saturation:
      - 0.5
      - 1.2
      scale:
      - 0.5
      - 1.5
      shear: 0
      stretch:
      - - 1
        - 1
      - - 1
        - 1
      translate: 0.2
  val:
    ann_path: D:/NTUFYP/code/nanodet-main-im/dataset/kvasir-Dataset/kvasir-seg/Kvasir-SEG/val_coco.json
    img_path: D:/NTUFYP/code/nanodet-main-im/dataset/kvasir-Dataset/kvasir-seg/Kvasir-SEG/images
    input_size:
    - 320
    - 320
    keep_ratio: true
    name: CocoDataset
    pipeline:
      normalize:
      - - 103.53
        - 116.28
        - 123.675
      - - 57.375
        - 57.12
        - 58.395
device:
  batchsize_per_gpu: 8
  gpu_ids:
  - -1
  precision: 32
  workers_per_gpu: 0
evaluator:
  name: CocoDetectionEvaluator
  save_key: mAP
log:
  interval: 50
model:
  arch:
    backbone:
      activation: LeakyReLU
      model_size: 0.05x_extreme
      name: ShuffleNetV2
      out_stages:
      - 2
      - 3
      - 4
    fpn:
      in_channels:
      - 8
      - 16
      - 32
      name: PAN
      num_outs: 3
      out_channels: 8
      start_level: 0
    head:
      feat_channels: 8
      input_channel: 8
      loss:
        loss_bbox:
          loss_weight: 2.0
          name: GIoULoss
        loss_dfl:
          loss_weight: 0.25
          name: DistributionFocalLoss
        loss_qfl:
          beta: 2.0
          loss_weight: 1.0
          name: QualityFocalLoss
          use_sigmoid: true
      name: NanoDetHead
      norm_cfg:
        type: BN
      num_classes: 1
      reg_max: 4
      stacked_convs: 1
    name: OneStageDetector
save_dir: workspace/nanodet_extreme_minimal
schedule:
  lr_schedule:
    gamma: 0.1
    milestones:
    - 130
    - 160
    - 175
    name: MultiStepLR
  optimizer:
    lr: 0.07
    momentum: 0.9
    name: SGD
    weight_decay: 0.0001
  total_epochs: 180
  val_intervals: 10
  warmup:
    name: linear
    ratio: 1.0e-05
    steps: 1000
test: {}
